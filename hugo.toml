baseURL = 'https://clubdefisicauab.cat/'
locale = 'ca'
title = 'Club de Física UAB'
theme = 'blowfish'
buildFuture = true
# Manté els noms de categories i etiquetes tal com s'escriuen (p. ex. "Club de Física", no "Club De Física")
titleCaseStyle = "none"

[services.googleAnalytics]
  id = "G-99XSV6TSK4"

[params]
  logo = "logo.png"
  description = "Club de Física de la Universitat Autònoma de Barcelona: un espai per aprendre, explorar i compartir la física."
  copyright = "© { year } Club de Física UAB"
  defaultAppearance = "light"
  autoSwitchAppearance = false
  enableSearch = false
    favicon = "favicon.ico"
    # Si el tema busca aquestes mides, posa-les també
    favicon16 = "favicon-16x16.png"
    favicon32 = "favicon-32x32.png"
    appleTouchIcon = "apple-touch-icon.png"

[params.header]
  # Capçalera pròpia: barra fosca de xarxes + menú (layouts/partials/header/fixed-club.html)
  layout = "fixed-club"
  themeToggle = false
  showTitle = true

[params.footer]
  showAppearanceSwitcher = false

# Xarxes i correu del Club. Es fan servir a la barra superior, al peu de pàgina,
# a la pàgina de Contacte i a la portada: només cal canviar-los aquí.
[params.club]
  email = "clubdefisicauab@gmail.com"
  instagram = "clubfisicauab"
  x = "clubdefisicauab"

[markup.goldmark.renderer]
  unsafe = true

[[menu.main]]
  identifier = "inici"
  name = "Inici"
  url = "/"
  weight = 10

[[menu.main]]
  identifier = "qui"
  name = "Qui Som"
  url = "/qui-som/"
  weight = 20

[[menu.main]]
  identifier = "blog"
  name = "Blog"
  url = "/blog/"
  weight = 30

  [[menu.main]]
  identifier = "paperillos"
  name = "Paperillos"
  url = "/paperillos/"
  weight = 40

[[menu.main]]
  name = "Agenda"
  url = "/agenda/"
  weight = 50

[[menu.main]]
  identifier = "contacte"
  name = "Contacte"
  url = "/contacte/"
  weight = 60

[[menu.footer]]
  name = "Política de Privadesa"
  url = "/politica-privadesa/"
  weight = 10

paginate = 30


[article]
  showComments = true

[comments]
  system = "giscus"

[giscus]
  repo = "clubfisicauab/cf-web" # El teu usuari i repo de GitHub
  repoId = "R_kgDONi9X0g"      # El data-repo-id que has obtingut
  category = "General" 
  categoryId = "DIC_kwDONi9X0s4DAnhs" # El data-category-id que has obtingut
  mapping = "pathname"
  theme = "preferred_color_scheme"                     # Posa la interfície en català