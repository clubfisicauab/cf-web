baseURL = 'https://clubdefisicauab.cat/'
locale = 'ca'
title = 'Club de Física UAB'
theme = 'blowfish'
buildFuture = true
enableRobotsTXT = true
# Manté els noms de categories i etiquetes tal com s'escriuen (p. ex. "Club de Física", no "Club De Física")
titleCaseStyle = "none"

# Les imatges de static/ també es poden processar (redimensionar, WebP) des de les plantilles.
# Es continuen publicant igual que abans, així que cap enllaç existent es trenca.
[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static"
    target = "assets"

[imaging]
  quality = 78
  resampleFilter = "Lanczos"

[pagination]
  pagerSize = 12

# index.json: índex que fa servir el cercador de la web
[outputs]
  home = ["HTML", "RSS", "JSON"]

# Categories, etiquetes i curs acadèmic dels posts (per filtrar el blog per curs)
[taxonomies]
  category = "categories"
  tag = "tags"
  curs = "cursos"

# Posts relacionats que surten al final de cada post
[related]
  includeNewer = true
  threshold = 60
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "categories"
    weight = 60
  [[related.indices]]
    name = "date"
    weight = 10
    pattern = "2006"

[params]
  logo = "logo.png"
  description = "Club de Física de la Universitat Autònoma de Barcelona: un espai per aprendre, explorar i compartir la física."
  copyright = "© { year } Club de Física UAB"
  defaultAppearance = "light"
  autoSwitchAppearance = false
  enableSearch = true
    favicon = "favicon.ico"
    # Si el tema busca aquestes mides, posa-les també
    favicon16 = "favicon-16x16.png"
    favicon32 = "favicon-32x32.png"
    appleTouchIcon = "apple-touch-icon.png"

[params.header]
  # Capçalera pròpia: barra fosca de xarxes + menú (layouts/partials/header/fixed-club.html)
  layout = "fixed-club"
  themeToggle = false
  showTitle = true

[params.footer]
  showAppearanceSwitcher = false

# Xarxes i correu del Club. Es fan servir a la barra superior, al peu de pàgina,
# a la pàgina de Contacte i a la portada: només cal canviar-los aquí.
[params.club]
  email = "clubdefisicauab@gmail.com"
  instagram = "clubfisicauab"
  x = "clubdefisicauab"
  # Enllaços opcionals. Si estan buits, el botó corresponent no apareix.
  formulari = ""  # Formulari "Vull rebre avisos" (p. ex. un Google Form)
  butlleti = ""   # Pàgina d'alta d'un butlletí per correu (p. ex. Buttondown o Substack)

  # Adreça per defecte de les activitats (per a Google i els calendaris)
  [params.club.adreca]
    lloc = "Facultat de Ciències, Universitat Autònoma de Barcelona"
    localitat = "Bellaterra (Cerdanyola del Vallès)"
    codiPostal = "08193"
    regio = "Barcelona"
    pais = "ES"

# Galetes: Google Analytics només es carrega en producció i si el visitant ho accepta.
[params.galetes]
  googleAnalytics = "G-99XSV6TSK4"
  # Si canvies la política de galetes, canvia aquesta versió i es tornarà a demanar el consentiment.
  versio = "2026-09"

# Comentaris dels paperillos (giscus, a partir de les Discussions de GitHub)
[params.giscus]
  repo = "clubfisicauab/cf-web"
  repoId = "R_kgDONi9X0g"
  category = "General"
  categoryId = "DIC_kwDONi9X0s4DAnhs"
  mapping = "pathname"

[markup.goldmark.renderer]
  unsafe = true

# Fórmules: el text entre \( \), \[ \] o $$ $$ arriba intacte a KaTeX
[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [['\[', '\]'], ['$$', '$$']]
    inline = [['\(', '\)']]

