    </a>
    <a href="https://x.com/clubdefisicauab" target="_blank" aria-label="X">
      <svg viewBox="0 0 24 24"><path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z"/></svg>

<!-- CONTENIDOR DEL POST -->
<article style="max-width: 900px; margin: 4rem auto 6rem auto; padding: 0 1.5rem;">

  <!-- CAPÇALERA (Canviat d'<header> a <div> per evitar el teu display:none) -->
  <div style="background-color: #f8f9fa; border-left: 4px solid #Eab308; padding: 2.5rem 2rem; border-radius: 0 12px 12px 0; margin-bottom: 2.5rem; border-top: 1px solid #e5e7eb; border-right: 1px solid #e5e7eb; border-bottom: 1px solid #e5e7eb;">
    
    <!-- Categories -->
    {{ if .Params.categories }}
    <div style="display: flex; gap: 0.5rem; margin-bottom: 1.2rem; flex-wrap: wrap;">
      {{ range .Params.categories }}
      <span style="background-color: #ffffff; border: 1px solid #d1d5db; color: #555; padding: 0.2rem 0.8rem; border-radius: 4px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;">
        {{ . }}
      </span>
      {{ end }}
    </div>
    {{ end }}

    <!-- Títol de l'article -->
    <h1 style="font-size: 2.4rem; font-weight: 800; color: #111; margin-bottom: 1.5rem; line-height: 1.2;">
      {{ .Title }}
    </h1>

    <!-- Metadades (Autor i Data) -->
    <div style="display: flex; flex-wrap: wrap; gap: 1.5rem; font-size: 0.95rem; color: #555; font-weight: 600;">
      
      {{ if .Params.author }}
      <span style="display: flex; align-items: center; gap: 0.4rem;">
        <svg viewBox="0 0 24 24" style="width: 18px; height: 18px; fill: currentColor;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
        <span style="color: #111;">{{ .Params.author }}</span>
      </span>
      {{ end }}

      <span style="display: flex; align-items: center; gap: 0.4rem;">
        <svg viewBox="0 0 24 24" style="width: 18px; height: 18px; fill: currentColor;"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7v-5z"/></svg>
        {{ .Date.Format "02/01/2006" }}
      </span>

    </div>
  </div>

  <!-- CONTINGUT FORMATAT (Aprofita l'estil tipogràfic de Tailwind/Blowfish) -->
  <div class="prose prose-lg max-w-none dark:prose-invert prose-img:rounded-xl prose-a:text-yellow-600" style="color: #333; line-height: 1.7;">
    {{ .Content }}
  </div>

</article>

{{ end }}
